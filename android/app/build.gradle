apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

project.ext.envConfigFiles = [
    debug: ".env",
    release: ".env",
]
apply from: file("../../node_modules/react-native-config/android/dotenv.gradle")

// Release builds must be compiled with .env present. The file is gitignored, so
// a clean checkout would otherwise produce an APK whose react-native-config
// values are empty and which cannot reach the Supabase backend.
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def envFile = file("../../.env")
if (isReleaseBuild && !envFile.exists()) {
    throw new GradleException(
        "Missing .env for the release build. Create para-app/.env with SUPABASE_URL " +
        "and SUPABASE_ANON_KEY (see .env.example) before running assembleRelease."
    )
}

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def getAppVersion() {
    def inputFile = new File(rootProject.projectDir, '../package.json')
    if (!inputFile.exists()) return "1.0.0"
    def packageJson = new groovy.json.JsonSlurper().parseText(inputFile.text)
    return packageJson.version ?: "1.0.0"
}

def getAppVersionCode() {
    def versionStr = getAppVersion()
    def parts = versionStr.tokenize('.')
    def major = parts.size() > 0 ? parts[0].toInteger() : 1
    def minor = parts.size() > 1 ? parts[1].toInteger() : 0
    def patch = parts.size() > 2 ? parts[2].toInteger() : 0
    return (major * 10000) + (minor * 100) + patch
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    namespace "com.paraapp"
    defaultConfig {
        applicationId "com.paraapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode getAppVersionCode()
        versionName getAppVersion()
        resValue "string", "build_config_package", "com.paraapp"
        manifestPlaceholders = [
            GOOGLE_MAPS_API_KEY: project.env.get("GOOGLE_MAPS_API_KEY", "")
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('PARA_STORE_FILE')) {
                storeFile file(PARA_STORE_FILE)
                storePassword PARA_STORE_PASSWORD
                keyAlias PARA_KEY_ALIAS
                keyPassword PARA_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig (project.hasProperty('PARA_STORE_FILE') ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    def isHermes = (project.findProperty("hermesEnabled") ?: "true").toBoolean()
    if (isHermes) {
        implementation("com.facebook.react:hermes-android")
    } else {
        def jscFlavor = project.findProperty("jscFlavor") ?: "org.webkit:android-jsc:+"
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
